[package]
name = "tooler"
version = "0.4.0"
edition = "2024"
description = "A modular CLI toolkit"
authors = ["Antonio Ventura <antonioventura.j@gmail.com>"]

[[bin]]
name = "tooler"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "env"] }
anyhow = "1"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap_complete = "4"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
chrono = "0.4"
serde_yaml = "0.9"
keyring = "4"
rmcp = { version = "2", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "net"] }
axum = "0.8"
printpdf = "0.8"
rust_xlsxwriter = "0.89"
scraper = "0.27.0"
rustyline = "18.0.1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "pool", "rustls-tls"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16.7"
csv = "1.4.0"
similar = "2"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
