name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Verify tag and package
        shell: bash
        run: |
          package="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tooler") | .name')"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tooler") | .version')"
          test "$package" = "tooler"
          test "$version" != "null"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Verify package archive
        run: cargo package --locked --allow-dirty --no-verify --list > /dev/null

  build:
    name: Build ${{ matrix.target }}
    needs: verify-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tooler-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tooler-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: tooler-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tooler-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tooler-windows-x86_64.exe

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify package output
        shell: bash
        run: test -x target/${{ matrix.target }}/release/tooler${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/tooler ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cp target\${{ matrix.target }}\release\tooler.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        working-directory: artifacts
        shell: bash
        run: |
          expected=(
            tooler-linux-x86_64
            tooler-linux-aarch64
            tooler-macos-x86_64
            tooler-macos-aarch64
            tooler-windows-x86_64.exe
          )
          mapfile -t actual < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
            printf '%s\n' "${actual[@]}" | grep -Fx "$artifact" >/dev/null
          done

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
